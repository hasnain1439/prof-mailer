# Render Blueprint for the prof-mailer API (Express + Prisma). The web app is deployed on Vercel.
services:
  - type: web
    name: prof-mailer-api
    runtime: node
    plan: free
    rootDir: api
    # --include=dev: NODE_ENV=production would otherwise make `npm ci` skip prisma/typescript (devDependencies).
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DRY_RUN
        value: "true"
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: APP_PASSWORD_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: PUBLIC_URL
        sync: false
