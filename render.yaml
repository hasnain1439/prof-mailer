# Render Blueprint for the prof-mailer API (Express + Prisma). The web app is deployed on Vercel.
services:
  - type: web
    name: prof-mailer-api
    runtime: node
    plan: free
    rootDir: api
    # --include=dev: NODE_ENV=production would otherwise make `npm ci` skip prisma/typescript (devDependencies).
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DRY_RUN
        value: "true"
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: API_PROXY_SECRET # same value as API_PROXY_SECRET on Vercel
        sync: false
      - key: PUBLIC_URL
        sync: false
